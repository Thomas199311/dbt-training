version: 2

models:
  - name: dim_corpo_employee
    description: Table avec les informations concernant les employees

    columns:
      - name: user_id
        description: identifiant unique pour un utilisateur
        tests:
          - unique
          - not_null
      - name: first_name
      - name: last_name
      - name: email
      - name: phone_number
      - name: organisation_id
      - name: organisation_name
      - name: pricing_plan
      - name: subscribed_at
   
  - name: fact_corpo_subscription_income
    description: Table avec les informations concernant les abonnements

    columns:
      - name: month
      - name: organisation_id
      - name: organisation_name
      - name: income
      - name: pricing_plan

  - name: fact_income_monthly
    description: Table avec les informations des revenus par mois et par type

    columns:
      - name: month
      - name: product_name
      - name: income

  - name: fact_travel_car_booking
    description: Table avec les informations concernant les reservations de voiture

    columns:
      - name: booking_reference
      - name: booked_at
      - name: start_date
      - name: end_date
      - name: booking_status
      - name: booking_price
      - name: commission_percentage
      - name: organisation_id
      - name: organisation_name
      - name: user_id
      - name: car_rental_company_id
      - name: car_rental_company_name 
      - name: car_model_name
      - name: payment_done_at

  - name: fact_travel_hotel_booking
    description: Table avec les informations concernant les reservations d hotel

    columns:
      - name: booking_reference
      - name: booked_at
      - name: start_date
      - name: end_date
      - name: booking_status
      - name: booking_price
      - name: commission_percentage
      - name: organisation_id
      - name: organisation_name
      - name: user_id
      - name: hotel_id
      - name: hotel_name 
      - name: hotel_room_id
      - name: payment_done_at

  - name: fact_travel_income
    description: cette table contient les revenus par jour par type de produit et par organisation

    columns:
      - name: day
      - name: product_type
      - name: income
      - name: organisation_id
      - name: organisation_name
